    <script>
      window.dataLayer = window.dataLayer || [];

    <!-- Google Tag Manager.
         Só carrega se houver um container de verdade. Sem a guarda, com a
         variável vazia o snippet pedia gtm.js?id= a cada visita: uma
         requisição que falha para todo visitante, e um container que parecia
         instalado sem estar. No dia em que VITE_GTM_CONTAINER_ID for
         preenchida, isto passa a carregar sozinho. -->
    <script>(function(w,d,s,l,i){if(!/^GTM-[A-Z0-9]+$/.test(i))return;w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','%VITE_GTM_CONTAINER_ID%');</script>
