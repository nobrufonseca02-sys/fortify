version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      application-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/metaapi-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gateway-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/whatsapp-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      whatsapp-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
