name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Tracked secret patterns
        shell: bash
        run: |
          set -euo pipefail
          patterns='sk_(test|live)_[A-Za-z0-9]{24,}|whsec_[A-Za-z0-9]{24,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*eyJ[A-Za-z0-9_-]{40,}|METAAPI_TOKEN[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{40,}|MT5(_|[[:space:]])*PASSWORD[[:space:]]*=[[:space:]]*[^[:space:]]{8,}'
          if git grep -I -n -E "$patterns" -- ':!*.example'; then
            echo 'Potential secret found in a tracked file.' >&2
            exit 1
          fi

  gateway:
    name: Gateway validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/metaapi-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: services/metaapi-gateway/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test

  whatsapp-agent:
    name: WhatsApp agent validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: services/whatsapp-agent/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
